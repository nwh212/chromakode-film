[package]
name = "chromakode"
description = "Chromaforge pixel filters: ChromaKode Film, film stocks (ChromaKode 64, ChromaGold 200) sharing one engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]   # rlib: the look's tests and the sample renderer run natively

[features]
# Build ChromaGold 200 instead of ChromaKode 64 (tools/build.sh builds both).
gold = []
# Build ChromaStill 800T.
still = []
# Build ChromaLome Purple.
purple = []

[dependencies]
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = true
strip = true
codegen-units = 1
